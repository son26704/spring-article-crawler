spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: crawler-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.dantri.crawler.queue,com.dantri.crawler.domain,java.util,java.lang"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      cluster:
        nodes:
          - localhost:6379
          - localhost:6380
          - localhost:6381
          - localhost:6382
          - localhost:6383
          - localhost:6384

management:
  endpoints:
    web:
      exposure:
        include: health, info, redis
  endpoint:
    health:
      show-details: always
crawler:
  redis-prefix: crawler
  start-urls:
    - https://dantri.com.vn/
    - https://vnexpress.net/
    - https://tuoitre.vn/
    - https://vietnamnet.vn/
    - https://tienphong.vn/
    - https://thanhnien.vn/
    - https://vtcnews.vn/
    - https://danviet.vn/
    - https://nhandan.vn/
    - https://www.qdnd.vn/
    - https://soha.vn/
    - https://baochinhphu.vn/
  settings:
    max-urls-per-crawl: 100
    default-max-level: 4
    request-delay-ms: 200
    thread-pool-size: 6
    six-months-millis: 15552000000
    min-body-length: 150
    min-tag-length: 20
    non-article-ttl: 18000000     # 5h
