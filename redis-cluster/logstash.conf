input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  # Xóa tag lỗi nếu có
  if "_dateparsefailure" in [tags] {
    mutate {
      remove_tag => ["_dateparsefailure"]
    }
  }

  # Không cần xử lý timestamp phức tạp
  mutate {
    add_field => { "processed_by" => "logstash" }
    add_field => { "index_time" => "%{+YYYY.MM.dd}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Đổi tên index để tránh conflict với data stream
    index => "crawler-logs-%{+YYYY.MM.dd}"
    # Tắt data stream mode
    data_stream => "false"
  }
}